# Insert in the existing HTTPS dashboard server. Replace token privately.
# Path and Host must match config.json. Proxy cannot be exposed as a second unauthenticated listener.
location /wordpress/ {
    proxy_pass http://unix:/run/homarr-wordpress/app.sock:/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-WordPress-Proxy "<INSERT_SAME_PROXY_TOKEN_AS_CONFIG>";
    proxy_set_header Authorization $http_authorization;
    access_log off;
}
