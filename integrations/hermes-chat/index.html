<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hermes chat</title><link rel="stylesheet" href="./chat.css"><script src="./chat.js" defer></script></head><body>
<header><div class="brand"><span class="mark">›_</span><strong>Hermes</strong><span id="status" role="status">Connecting…</span></div><button id="new" title="Start a new conversation">New chat ↗</button></header>
<main id="messages" aria-label="Conversation" aria-live="polite"><div id="welcome"><span class="spark">✦</span><h1>What are we working on?</h1><p>Your personal Hermes.</p><div class="suggestions"><button data-prompt="What can you help me with?">Explore capabilities</button><button data-prompt="Help me plan my next project.">Plan a project</button></div></div></main>
<form id="composer"><label class="sr" for="prompt">Message Hermes</label><textarea id="prompt" placeholder="Message Hermes…" rows="2" maxlength="16000"></textarea><div class="actions"><button id="session" type="button" hidden title="Copy the shared Hermes session ID">Session</button><span id="hint">Enter to send · Shift+Enter for a new line</span><button id="stop" type="button" hidden>Stop ■</button><button id="send" type="submit">Send ↑</button></div></form>
</body></html>
